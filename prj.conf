CONFIG_LOG=y
# Deferred mode: synchronous printing blocks the calling thread for
# milliseconds and would wreck the ranging timestamps. The responder
# calls k_msleep(1) after each reply so the log thread gets a slot.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_SPI=y
CONFIG_GPIO=y

# Persistent per-node configuration: antenna delay, and later the
# node role and id. FLASH_PAGE_LAYOUT is a dependency of NVS;
# FLASH_MAP provides PARTITION_DEVICE and PARTITION_OFFSET.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Shell over the same UART already used for log output, so the
# address and antenna delay can be written from the board instead
# of being burned in at build time.
CONFIG_SHELL=y
