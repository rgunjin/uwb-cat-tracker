CONFIG_LOG=y
# Deferred mode: synchronous printing blocks the calling thread for
# milliseconds and would wreck the ranging timestamps. The responder
# calls k_msleep(1) after each reply so the log thread gets a slot.
CONFIG_LOG_MODE_DEFERRED=y

# Logs go to RTT, not to the UART. RTT writes into a ring buffer in
# the chip's own RAM, which the on-board J-Link reads over SWD, so
# output survives until a host connects instead of being lost when
# nothing is listening. It is also far faster than 115200 baud,
# which matters because every log call sits inside the T_reply this
# project measures.
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# 1 KB holds only about six statistics lines; 4 KB covers a full
# warm-up run, so the board can be left alone and read later.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# The shell's own log backend is off as well: with it on, every
# message is printed a second time into the shell terminal and
# collides with whatever is being typed there.
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_SPI=y
CONFIG_GPIO=y

# Persistent per-node configuration: antenna delay, and later the
# node role and id. FLASH_PAGE_LAYOUT is a dependency of NVS;
# FLASH_MAP provides PARTITION_DEVICE and PARTITION_OFFSET.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Interactive shell on the UART, which is now free of log output:
# the address and antenna delay can be written from the board
# instead of being burned in at build time.
CONFIG_SHELL=y
